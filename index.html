</div>
<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="themeModal"><section class="modal"><div class="modal-head"><h2>自定义主题</h2><button class="close" data-close="themeModal">×</button></div><p class="modal-desc">调整桌面归档的氛围，打造你喜欢的工作空间。</p><label class="field-label">主题名称</label><input class="text-field" id="themeName" value="鼠尾草绿" maxlength="16" /><label class="field-label">选择主题色</label><div class="color-row" id="swatches"><button class="swatch active" style="background:#748c70" data-color="#748c70"></button><button class="swatch" style="background:#788a9e" data-color="#788a9e"></button><button class="swatch" style="background:#b47f73" data-color="#b47f73"></button><button class="swatch" style="background:#a78c5c" data-color="#a78c5c"></button><button class="swatch" style="background:#8e7ca7" data-color="#8e7ca7"></button><input class="custom-color" type="color" id="customColor" value="#748c70" title="自选颜色" /></div><label class="field-label">界面底色</label><div class="color-row" id="bgSwatches"><button class="swatch active" style="background:#f6f5f1" data-bg="#f6f5f1"></button><button class="swatch" style="background:#f3f5f7" data-bg="#f3f5f7"></button><button class="swatch" style="background:#f5f1ef" data-bg="#f5f1ef"></button><button class="swatch" style="background:#f2f0f6" data-bg="#f2f0f6"></button><button class="swatch" style="background:#edf2ec" data-bg="#edf2ec"></button></div><div class="theme-preview" id="themePreview"><i></i><span></span><span></span><i></i></div><div class="modal-actions"><button class="secondary" data-close="themeModal">取消</button><button class="save" id="saveTheme">应用主题</button></div></section></div>
<div class="modal-backdrop" id="categoryModal"><section class="modal"><div class="modal-head"><h2>新建分类</h2><button class="close" data-close="categoryModal">×</button></div><p class="modal-desc">为桌面文件添加一个专属分类。</p><label class="field-label">分类名称</label><input class="text-field" id="categoryName" placeholder="例如：工作项目" maxlength="12" /><label class="field-label">分类颜色</label><div class="color-row" id="categoryColors"><button class="swatch active" style="background:#748c70" data-color="#748c70"></button><button class="swatch" style="background:#788a9e" data-color="#788a9e"></button><button class="swatch" style="background:#b47f73" data-color="#b47f73"></button><button class="swatch" style="background:#a78c5c" data-color="#a78c5c"></button><button class="swatch" style="background:#8e7ca7" data-color="#8e7ca7"></button></div><div class="modal-actions"><button class="secondary" data-close="categoryModal">取消</button><button class="save" id="saveCategory">创建分类</button></div></section></div>
<script>
const files=[
 {name:'品牌视觉提案_v3.pdf',type:'文档',ext:'PDF',size:'4.8 MB',time:'10:42',category:'文档',kind:'pdf'},
 {name:'周末山野计划.jpg',type:'图片',ext:'JPG',size:'2.1 MB',time:'09:18',category:'图片',kind:'photo'},
 {name:'Q4_项目预算.xlsx',type:'表格',ext:'XLSX',size:'860 KB',time:'昨天',category:'表格',kind:'sheet'},
 {name:'灵感收集与会议记录.docx',type:'文档',ext:'DOCX',size:'320 KB',time:'昨天',category:'文档',kind:'doc'},
 {name:'产品发布会.key',type:'其他',ext:'KEY',size:'18.2 MB',time:'周五',category:'其他',kind:'slide'},
 {name:'首页插画_final.png',type:'图片',ext:'PNG',size:'3.4 MB',time:'周五',category:'图片',kind:'photo'},
 {name:'landing-page_v2.html',type:'其他',ext:'HTML',size:'24 KB',time:'周四',category:'其他',kind:'code'},
 {name:'雨天听的歌.mp3',type:'其他',ext:'MP3',size:'8.6 MB',time:'周三',category:'其他',kind:'audio'}
];
let categories=[{name:'文档',color:'#788a9e',visible:true},{name:'图片',color:'#b47f73',visible:true},{name:'表格',color:'#748c70',visible:true},{name:'其他',color:'#a78c5c',visible:true}];let filter='all',view='all',query='',themeColor='#748c70',themeBg='#f6f5f1',newCatColor='#748c70';const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function hexRgb(hex){let h=hex.replace('#','');return `${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)}`}
function renderCats(){const list=$('#catList');list.innerHTML=categories.map(c=>`<div class="cat-row ${filter===c.name?'active-cat':''} ${c.visible?'':'is-hidden'}" data-cat="${c.name}" style="--dot:${c.color}"><span class="cat-dot"></span><span class="cat-name">${c.name}</span><span class="cat-count">${files.filter(f=>f.category===c.name).length}</span><button class="eye-btn" title="${c.visible?'隐藏':'显示'}分类" data-eye="${c.name}"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div>`).join('');list.querySelectorAll('.cat-row').forEach(row=>row.addEventListener('click',e=>{if(e.target.closest('.eye-btn'))return;filter=row.dataset.cat;view='all';$$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view==='all'));renderCats();renderFiles()}));list.querySelectorAll('[data-eye]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();let c=categories.find(x=>x.name===btn.dataset.eye);c.visible=!c.visible;if(filter===c.name&&!c.visible)filter='all';renderCats();renderFiles();toast(`${c.name}分类已${c.visible?'显示':'隐藏'}`)}))}
function preview(f){let html='';if(f.kind==='photo')html='<span class="sun"></span>';if(f.kind==='doc')html='<div class="paper"><i></i><i></i><i></i><i></i></div>';if(f.kind==='sheet')html='<div class="sheet-art">'+Array(16).fill('<i></i>').join('')+'</div>';if(f.kind==='pdf')html='<div class="pdf-art">PDF</div>';if(f.kind==='slide')html='<div class="slide-art"></div>';if(f.kind==='code')html='<div class="code-art"><span>&lt;section&gt;</span><br/>  organize()<br/><span>&lt;/section&gt;</span></div>';if(f.kind==='audio')html='<div class="audio-art">'+[10,23,15,30,18,26,13,32,18,26,12,22,16,30,11,24,14,28,9].map(h=>`<i style="--h:${h}px"></i>`).join('')+'</div>';if(f.kind==='zip')html='<div class="zip-art">▤</div>';return `<div class="file-preview ${f.kind}"><span class="file-ext">${f.ext}</span>${html}<button class="more" title="更多操作">···</button></div>`}
function renderFiles(){const grid=$('#fileGrid');let shown=files.filter(f=>(filter==='all'||f.category===filter)&&(categories.find(c=>c.name===f.category)?.visible!==false)&&(view!=='starred'||f.starred)&&(view!=='recent'||true)&&(!query||f.name.toLowerCase().includes(query.toLowerCase())));$('#visibleCount').textContent=`显示 ${shown.length} 个项目`;
$('#sectionTitle').textContent=view==='starred'?'已收藏':view==='recent'?'最近整理':filter==='all'?'最近文件':filter+'文件';$('#hiddenCount').textContent=files.filter(f=>categories.find(c=>c.name===f.category)?.visible===false).length;$('#hiddenStrip').classList.toggle('show',files.some(f=>categories.find(c=>c.name===f.category)?.visible===false));
grid.innerHTML=shown.length?shown.map((f,i)=>`<article class="file-card" style="--dot:${categories.find(c=>c.name===f.category)?.color||'#aaa'}">${preview(f)}<div class="file-info"><div class="filename" title="${f.name}">${f.name}</div><div class="file-meta"><span class="file-tag"><i class="tiny-dot"></i>${f.category}</span><span>${f.size} · ${f.time}</span></div></div></article>`).join(''):`<div class="empty">没有找到匹配的文件，试试其他关键词或分类。</div>`;grid.querySelectorAll('.more').forEach((b,i)=>b.addEventListener('click',()=>{const f=shown[i];f.starred=!f.starred;toast(f.starred?'已添加到收藏':'已取消收藏');renderFiles()}));}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
function applyTheme(){document.documentElement.style.setProperty('--accent',themeColor);document.documentElement.style.setProperty('--accent-rgb',hexRgb(themeColor));document.documentElement.style.setProperty('--bg',themeBg);$('#customColor').value=themeColor;$('#themePreview').style.setProperty('--preview-accent',themeColor);$('#themePreview').style.setProperty('--preview-bg',themeBg)}
$$('.filter-btn').forEach(b=>b.addEventListener('click',()=>{$$('.filter-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');filter=b.dataset.filter==='all'?'all':b.dataset.filter;view='all';renderCats();renderFiles()}));
$$('.nav-item').forEach(b=>b.addEventListener('click',()=>{$$('.nav-item').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;filter='all';$$('.filter-btn').forEach(x=>x.classList.toggle('selected',x.dataset.filter==='all'));renderCats();renderFiles()}));
$('#search').addEventListener('input',e=>{query=e.target.value;renderFiles()});$('#showAll').addEventListener('click',()=>{categories.forEach(c=>c.visible=true);renderCats();renderFiles();toast('所有分类已显示')});
$('#organize').addEventListener('click',()=>{const btn=$('#organize');btn.disabled=true;btn.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10m-7 5h4"/></svg>正在整理…';setTimeout(()=>{btn.disabled=false;btn.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10m-7 5h4"/><path d="m18 4 2 3-2 3"/></svg>一键整理桌面';toast('整理完成，6 个项目已自动归类')},850)});$('#refresh').addEventListener('click',()=>{toast('桌面内容已更新')});
$('#openTheme').addEventListener('click',()=>$('#themeModal').classList.add('open'));$('#addCategory').addEventListener('click',()=>$('#categoryModal').classList.add('open'));$$('[data-close]').forEach(b=>b.addEventListener('click',()=>$('#'+b.dataset.close).classList.remove('open')));$$('.modal-backdrop').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));
$$('#swatches .swatch').forEach(b=>b.addEventListener('click',()=>{ $$('#swatches .swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active');themeColor=b.dataset.color;applyTheme()}));$('#customColor').addEventListener('input',e=>{themeColor=e.target.value;$$('#swatches .swatch').forEach(x=>x.classList.remove('active'));applyTheme()});$$('#bgSwatches .swatch').forEach(b=>b.addEventListener('click',()=>{$$('#bgSwatches .swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active');themeBg=b.dataset.bg;applyTheme()}));$('#saveTheme').addEventListener('click',()=>{$('#themeModal').classList.remove('open');toast(`「${$('#themeName').value||'自定义主题'}」已应用`)});
$$('#categoryColors .swatch').forEach(b=>b.addEventListener('click',()=>{$$('#categoryColors .swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active');newCatColor=b.dataset.color}));$('#saveCategory').addEventListener('click',()=>{const name=$('#categoryName').value.trim();if(!name){$('#categoryName').focus();return}if(categories.some(c=>c.name===name)){toast('这个分类已经存在');return}categories.push({name,color:newCatColor,visible:true});$('#categoryName').value='';$('#categoryModal').classList.remove('open');renderCats();renderFiles();toast(`已创建「${name}」分类`)});
renderCats();renderFiles();
</script>
</body>
</html>
